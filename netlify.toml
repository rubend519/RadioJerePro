[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm install && npm run build"

[functions]
  node_bundler = "esbuild"

# ── Redirects ──────────────────────────────────────────
[[redirects]]
  from = "/stream-proxy"
  to   = "/.netlify/functions/stream-proxy"
  status = 200

[[redirects]]
  from = "/admin"
  to   = "/admin.html"
  status = 200

# ── Headers de seguridad y CORS ────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options         = "DENY"
    X-Content-Type-Options  = "nosniff"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "geolocation=(self), microphone=()"

# app.min.js se regenera en cada deploy — nunca cachear agresivo,
# para que los TVs (que cachean fuerte) siempre tomen la versión nueva.
[[headers]]
  for = "/js/app.min.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type  = "application/javascript; charset=utf-8"

# CSS
[[headers]]
  for = "/css/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# stations.json — revalidar siempre (cambia con el admin)
[[headers]]
  for = "/stations.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"

# HTML — no cachear
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Fuentes
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Radio Jere TV</title>

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#0b0b0f;
  color:#ffffff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow:auto;
}

.header{
  padding:25px 35px;
  background:#121218;
  border-bottom:2px solid #ff3b52;
}

.logo{
  font-size:30px;
  font-weight:bold;
}

.logo span{
  color:#ff3b52;
}

.status{
  margin-top:8px;
  font-size:16px;
  color:#bbbbbb;
}

.container{
  padding:25px 35px 130px 35px;
}

h2{
  margin-top:0;
  font-size:26px;
}

.station{
  display:block;
  width:100%;
  box-sizing:border-box;
  margin-bottom:18px;
  padding:24px;
  background:#19191f;
  border:3px solid #33333d;
  border-radius:12px;
  color:#fff;
  text-align:left;
  font-size:24px;
  cursor:pointer;
}

.station:focus{
  outline:none;
  border-color:#ff3b52;
  background:#24242d;
}

.station.playing{
  border-color:#00d98b;
  background:#183029;
}

.station-name{
  font-size:24px;
  font-weight:bold;
}

.station-city{
  margin-top:7px;
  color:#aaa;
  font-size:17px;
}

.player{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:95px;
  background:#111118;
  border-top:2px solid #333;
  padding:15px 30px;
  box-sizing:border-box;
}

.now{
  font-size:20px;
  font-weight:bold;
  margin-bottom:10px;
}

.controls button{
  font-size:18px;
  padding:10px 25px;
  margin-right:10px;
  border:0;
  border-radius:8px;
  cursor:pointer;
}

.playbtn{
  background:#00d98b;
  color:#000;
}

.stopbtn{
  background:#ff4057;
  color:#fff;
}

#error{
  color:#ff6b78;
  margin-top:12px;
  font-size:17px;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">Radio Jere <span>TV</span></div>
  <div class="status" id="status">Cargando emisoras...</div>
</div>

<div class="container">

  <h2>Emisoras favoritas</h2>

  <div id="stations"></div>

  <div id="error"></div>

</div>

<div class="player">

  <div class="now" id="nowPlaying">
    Selecciona una emisora
  </div>

  <div class="controls">

    <button class="playbtn" id="resumeBtn">
      Reproducir
    </button>

    <button class="stopbtn" id="stopBtn">
      Detener
    </button>

  </div>

</div>

<audio id="audioPlayer" preload="none"></audio>

<script>
(function(){

  var audio = document.getElementById('audioPlayer');
  var stationsBox = document.getElementById('stations');
  var statusBox = document.getElementById('status');
  var errorBox = document.getElementById('error');
  var nowBox = document.getElementById('nowPlaying');

  var stationButtons = [];
  var currentButton = null;
  var currentStation = null;

  /*
   * Solo cargamos estas emisoras en modo TV.
   * Los nombres se buscan dentro de stations.json.
   */

  var wanted = [
    'Yariguies',
    'Yarigüies',
    'Guapachosa',
    'Radio Power',
    'Tropicana Bucaramanga'
  ];

  function normalize(text){

    if(!text){
      return '';
    }

    text = text.toLowerCase();

    text = text
      .replace(/á/g,'a')
      .replace(/é/g,'e')
      .replace(/í/g,'i')
      .replace(/ó/g,'o')
      .replace(/ú/g,'u')
      .replace(/ü/g,'u')
      .replace(/ñ/g,'n');

    return text;
  }

  function wantedStation(name){

    var n = normalize(name);
    var i;

    for(i=0;i<wanted.length;i++){

      if(n.indexOf(normalize(wanted[i])) !== -1){
        return true;
      }

    }

    return false;
  }

  function getStream(station){

    if(station.url_resolved){
      return station.url_resolved;
    }

    return station.url || '';
  }

  function clearPlaying(){

    var i;

    for(i=0;i<stationButtons.length;i++){
      stationButtons[i].className = 'station';
    }

  }

  function playStation(station,button){

    var url = getStream(station);

    errorBox.innerHTML = '';

    if(!url){

      errorBox.innerHTML =
        'Esta emisora no tiene una URL disponible.';

      return;
    }

    clearPlaying();

    currentStation = station;
    currentButton = button;

    button.className = 'station playing';

    nowBox.innerHTML =
      'Conectando: ' + station.name;

    try{

      audio.pause();

      audio.src = url;

      audio.load();

      var result = audio.play();

      /*
       * Navegadores modernos devuelven Promise.
       * Samsung antiguo puede devolver undefined.
       */

      if(
        result &&
        typeof result.catch === 'function'
      ){

        result.catch(function(){

          errorBox.innerHTML =
            'No se pudo iniciar automáticamente. ' +
            'Pulsa Reproducir.';

        });

      }

    }catch(e){

      errorBox.innerHTML =
        'Error al abrir la emisora.';

    }

  }

  audio.addEventListener(
    'playing',
    function(){

      if(currentStation){

        nowBox.innerHTML =
          'Reproduciendo: ' +
          currentStation.name;

      }

    },
    false
  );

  audio.addEventListener(
    'error',
    function(){

      if(currentStation){

        errorBox.innerHTML =
          'No fue posible reproducir ' +
          currentStation.name;

      }

    },
    false
  );

  document.getElementById(
    'resumeBtn'
  ).onclick = function(){

    if(!currentStation){
      return;
    }

    try{

      var result = audio.play();

      if(
        result &&
        typeof result.catch === 'function'
      ){

        result.catch(function(){});

      }

    }catch(e){}

  };

  document.getElementById(
    'stopBtn'
  ).onclick = function(){

    try{

      audio.pause();

      audio.removeAttribute('src');

      audio.load();

    }catch(e){}

    clearPlaying();

    currentStation = null;

    nowBox.innerHTML =
      'Selecciona una emisora';

  };

  function createStationButton(station){

    var button =
      document.createElement('button');

    button.className = 'station';

    button.innerHTML =
      '<div class="station-name">' +
      station.name +
      '</div>' +
      '<div class="station-city">' +
      (station.state || 'Colombia') +
      '</div>';

    button.onclick = function(){

      playStation(
        station,
        button
      );

    };

    stationsBox.appendChild(button);

    stationButtons.push(button);

  }

  function loadStations(){

    var xhr;

    try{

      xhr = new XMLHttpRequest();

    }catch(e){

      statusBox.innerHTML =
        'El navegador no permite cargar las emisoras.';

      return;

    }

    xhr.onreadystatechange = function(){

      if(xhr.readyState !== 4){
        return;
      }

      if(
        xhr.status !== 200 &&
        xhr.status !== 0
      ){

        statusBox.innerHTML =
          'Error cargando stations.json';

        return;
      }

      try{

        var data =
          JSON.parse(xhr.responseText);

        var stations =
          data.stations || [];

        var found = [];

        var i;

        for(i=0;i<stations.length;i++){

          if(
            wantedStation(
              stations[i].name
            )
          ){

            found.push(
              stations[i]
            );

          }

        }

        /*
         * Evitar duplicados.
         */

        var unique = [];
        var names = {};

        for(i=0;i<found.length;i++){

          var key =
            normalize(
              found[i].name
            );

          if(!names[key]){

            names[key] = true;

            unique.push(
              found[i]
            );

          }

        }

        stationsBox.innerHTML = '';

        for(i=0;i<unique.length;i++){

          createStationButton(
            unique[i]
          );

        }

        statusBox.innerHTML =
          unique.length +
          ' emisoras disponibles';

        if(
          stationButtons.length > 0
        ){

          stationButtons[0].focus();

        }

      }catch(e){

        statusBox.innerHTML =
          'Error procesando las emisoras';

        errorBox.innerHTML =
          'No se pudo leer stations.json';

      }

    };

    xhr.open(
      'GET',
      '/stations.json?tv=' +
      new Date().getTime(),
      true
    );

    xhr.send(null);

  }

  /*
   * Navegación básica para control remoto.
   */

  document.onkeydown = function(event){

    event =
      event ||
      window.event;

    var code =
      event.keyCode;

    if(
      stationButtons.length === 0
    ){
      return;
    }

    var active =
      document.activeElement;

    var index = -1;

    var i;

    for(
      i=0;
      i<stationButtons.length;
      i++
    ){

      if(
        stationButtons[i] === active
      ){

        index = i;
        break;

      }

    }

    /*
     * Flecha abajo.
     */

    if(code === 40){

      if(index < 0){
        index = 0;
      }else{
        index++;
      }

      if(
        index >=
        stationButtons.length
      ){

        index =
          stationButtons.length - 1;

      }

      stationButtons[
        index
      ].focus();

      if(event.preventDefault){
        event.preventDefault();
      }

    }

    /*
     * Flecha arriba.
     */

    if(code === 38){

      if(index < 0){
        index = 0;
      }else{
        index--;
      }

      if(index < 0){
        index = 0;
      }

      stationButtons[
        index
      ].focus();

      if(event.preventDefault){
        event.preventDefault();
      }

    }

    /*
     * Enter.
     */

    if(code === 13){

      if(
        active &&
        active.click
      ){

        active.click();

      }

    }

  };

  loadStations();

})();
</script>

</body>
</html>
